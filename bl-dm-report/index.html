<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#0f5b63" />
  <title>Duty Manager Report · Banchory Lodge</title>

  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=DM+Serif+Display&display=swap" />

  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/print.css" media="print" />

  <script type="module" src="js/main.js"></script>
</head>
<body>
  <header class="app-header">
    <div class="app-header__inner">
      <div class="brand">
        <h1 class="brand__title">Duty Manager Report</h1>
        <p class="brand__sub">Banchory Lodge · <span id="hdr-date">—</span></p>
      </div>
      <span class="conn-badge" id="conn-badge" data-state="offline">Offline</span>
    </div>
    <nav class="tabs no-print" role="tablist" aria-label="Sections">
      <button role="tab" class="tab" data-tab="dashboard" aria-selected="true">Dashboard</button>
      <button role="tab" class="tab" data-tab="today">Today</button>
      <button role="tab" class="tab" data-tab="lookahead">3-Day Look-ahead</button>
      <button role="tab" class="tab" data-tab="weekly">Weekly Stats</button>
      <button role="tab" class="tab" data-tab="admin">Admin</button>
    </nav>
  </header>

  <main class="wrap">
    <!-- Each panel is rendered by its module in js/tabs/. Print shows dashboard + weekly only. -->
    <section class="panel" id="panel-dashboard" data-panel="dashboard" role="tabpanel"></section>
    <section class="panel" id="panel-today"     data-panel="today"     role="tabpanel" hidden></section>
    <section class="panel" id="panel-lookahead" data-panel="lookahead" role="tabpanel" hidden></section>
    <section class="panel" id="panel-weekly"    data-panel="weekly"    role="tabpanel" hidden></section>
    <section class="panel" id="panel-admin"     data-panel="admin"     role="tabpanel" hidden></section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
